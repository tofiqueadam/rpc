<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors UI</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at top, #2b2b40 0%, #111118 70%);
            color: #f8fafc;
            font-family: Inter, system-ui, sans-serif;
        }

        #game-ui {
            width: min(100%, 520px);
            padding: 24px;
            border-radius: 24px;
            background: rgba(17, 24, 39, 0.95);
            box-shadow: 0 28px 80px rgba(0, 0, 0, 0.35);
        }

        #scores,
        #controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        #scores span {
            flex: 1 1 140px;
            padding: 14px 18px;
            border-radius: 18px;
            background: #111827;
            text-align: center;
            font-weight: 600;
        }

        .choice-button,
        #reset-button {
            flex: 1 1 140px;
            border: none;
            border-radius: 16px;
            padding: 14px 16px;
            color: white;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .choice-button {
            background: #3b82f6;
        }

        .choice-button:hover,
        #reset-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 20px rgba(59, 130, 246, 0.25);
        }

        #reset-button {
            background: #ef4444;
        }

        #status {
            margin-bottom: 20px;
            padding: 20px;
            border-radius: 20px;
            background: #111827;
        }

        #status p {
            margin: 0;
            line-height: 1.6;
        }

        #history-container {
            margin-top: 12px;
        }

        #history-container h3 {
            margin-bottom: 12px;
            font-size: 1rem;
            color: #cbd5e1;
        }

        #history-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 220px;
            overflow-y: auto;
        }

        #history-list li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            border-radius: 16px;
            background: #1f2937;
            margin-bottom: 10px;
        }

        #history-list li button {
            border: none;
            background: #f97316;
            color: white;
            border-radius: 12px;
            padding: 8px 12px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="game-ui">
        <div id="scores">
            <span id="human-score">You: 0</span>
            <span id="computer-score">Computer: 0</span>
        </div>

        <div id="controls">
            <button class="choice-button" data-choice="rock">Rock</button>
            <button class="choice-button" data-choice="paper">Paper</button>
            <button class="choice-button" data-choice="scissors">Scissors</button>
            <button id="reset-button" type="button">Reset</button>
        </div>

        <div id="status">
            <p id="round-result">Pick a move to start the game.</p>
            <p id="game-result"></p>
        </div>

        <div id="history-container">
            <h3>Round history</h3>
            <ul id="history-list"></ul>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
